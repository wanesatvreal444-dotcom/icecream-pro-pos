
name: Build IceCream Pro APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses
      - name: Extract project
        run: |
          mkdir project
          unzip icecream_pro_android_studio_project.zip -d project
          find project -name gradlew -type f

      - 
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          PROJECT_DIR="$(dirname "$(find project -name settings.gradle -type f | head -1)")"
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IceCream-Pro-POS-debug-APK
          path: project/**/build/outputs/apk/debug/*.apk
